name: 'recommendation_friction'
version: '1.0.0'
config-version: 2

# Profile name matching profiles.yml configuration
profile: 'recommendation_friction'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  recommendation_friction:
    # Staging models are views
    staging:
      +materialized: view
      +schema: staging
    # Marts models are loaded as physical tables
    marts:
      +materialized: table
      +schema: marts
