name: Nusantara Context-Aware Recommendation A/B Lab ETL

on:
  schedule:
    # Run weekly on Monday at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allow manual runs for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Hard timeout to prevent runaway billing/actions usage
    timeout-minutes: 10

    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      # Configure dbt to connect to MotherDuck
      DBT_DUCKDB_PATH: "md:///recommendation_lab"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dlt Ingestion Pipeline
        run: |
          python ingestion/pipeline.py

      - name: Run dbt Transformations & Tests
        run: |
          cd dbt_project
          dbt deps
          dbt run --target dev
          dbt test --target dev
